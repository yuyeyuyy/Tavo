name: tavo-local
x-backend: &backend
  image: tavo-backend:local
  build: ./backend
  user: "10001:10001"
  volumes:
    - backend-data:/data
    - backend-keys:/keys
  environment:
    # This deployment has no Docker CLI/socket; host Python runtime supports Bash.
    TAVO_BASH_ENABLED: "0"
    TAVO_DATA_DIR: /data
    TAVO_KEYRING_FILE: /keys/master.keys
    TAVO_CLIENT_TOKEN_FILE: /keys/client.token
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=16m
services:
  init:
    <<: *backend
    command: init
    restart: "no"
  api:
    <<: *backend
    command: api
    ports:
      - "127.0.0.1:${TAVO_HTTP_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8000),2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    <<: *backend
    command: worker
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  backend-data:
  backend-keys:
